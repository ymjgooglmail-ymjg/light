<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>尾牙控場 Pro Max - 跑馬燈版</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
            transition: background-color 0.3s ease; 
            display: flex; justify-content: center; align-items: center; 
            font-family: "Microsoft JhengHei", sans-serif; touch-action: manipulation;
        }

        /* 閃爍動畫 */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        .blinking { animation: blink var(--speed) infinite; }

        /* 跑馬燈動畫 */
        #marquee-container {
            position: absolute;
            width: 100%;
            white-space: nowrap;
            display: none; /* 預設隱藏 */
            z-index: 5;
        }
        #marquee-text {
            display: inline-block;
            font-size: 15vh; /* 字體大小隨螢幕高度調整 */
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            animation: marquee 5s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* 主控面板 */
        #admin-panel { 
            position: fixed; top: 10px; background: rgba(255, 255, 255, 0.95); 
            padding: 15px; display: none; z-index: 100; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 85%; max-width: 350px; text-align: center;
        }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
        .color-btn { width: 100%; aspect-ratio: 1; border: 1px solid #ddd; cursor: pointer; border-radius: 8px; }
        .ctrl-row { margin: 10px 0; border-top: 1px solid #eee; padding-top: 10px; font-size: 13px; color: #333; }
        input[type="range"], input[type="text"] { width: 100%; box-sizing: border-box; margin-top: 5px; }
        
        #status { color: white; font-size: 14px; background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 20px; z-index: 10; }
        #fs-notice { position: fixed; bottom: 20px; color: yellow; font-size: 12px; }
    </style>
</head>
<body onclick="enableFullscreen()">

    <div id="marquee-container">
        <span id="marquee-text">尾牙大吉！</span>
    </div>

    <div id="admin-panel">
        <div style="font-weight: bold; margin-bottom: 8px;">燈光與跑馬燈控制</div>
        
        <div class="btn-grid">
            <button class="color-btn" style="background: #FF0000;" onclick="sendColor('#FF0000')"></button>
            <button class="color-btn" style="background: #FFD700;" onclick="sendColor('#FFD700')"></button>
            <button class="color-btn" style="background: #0000FF;" onclick="sendColor('#0000FF')"></button>
            <button class="color-btn" style="background: #000000;" onclick="sendColor('#000000')"></button>
        </div>

        <div class="ctrl-row">
            <label>閃爍速度：<span id="speedVal">1.0</span>s</label>
            <input type="range" id="speedRange" min="0.1" max="2.0" step="0.1" value="1.0" oninput="updateSpeed(this.value)">
            <button onclick="toggleBlink(true)" style="background:#e74c3c; color:white; border:none; padding:5px; margin-top:5px; border-radius:5px;">啟動閃爍</button>
            <button onclick="toggleBlink(false)" style="background:#95a5a6; color:white; border:none; padding:5px; margin-top:5px; border-radius:5px;">停止閃爍</button>
        </div>

        <div class="ctrl-row">
            <label>跑馬燈文字：</label>
            <input type="text" id="marqueeInput" placeholder="輸入文字，例如：恭喜發財">
            <div style="margin-top:5px;">
                <button onclick="sendMarquee(true)" style="background:#2ecc71; color:white; border:none; padding:5px 10px; border-radius:5px;">開啟文字</button>
                <button onclick="sendMarquee(false)" style="background:#95a5a6; color:white; border:none; padding:5px 10px; border-radius:5px;">關閉文字</button>
            </div>
        </div>
    </div>

    <div id="status">點擊畫面進入全螢幕並連線...</div>
    <div id="fs-notice">※ 點擊螢幕可進入全螢幕模式</div>

    <script>
        const ABLY_API_KEY = 'cZshyg.HmG5Qw:R51peiFlUSI93TYcNN2gM7BlsvgGGAVFVQoaK62naGo'; 

        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.has('admin');
        const ably = new Ably.Realtime({ key: ABLY_API_KEY });
        const channel = ably.channels.get('tail-gate-party');

        function enableFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log("Fullscreen blocked"));
                document.getElementById('fs-notice').style.display = 'none';
            }
        }

        ably.connection.on('connected', () => {
            document.getElementById('status').innerText = isAdmin ? "控制端就緒" : "連線成功，等待指令";
            if (isAdmin) document.getElementById('admin-panel').style.display = 'block';
        });

        // 發送端
        function sendColor(color) { channel.publish('change', { type: 'color', val: color }); }
        function toggleBlink(state) { channel.publish('change', { type: 'blink', val: state }); }
        function updateSpeed(val) {
            document.getElementById('speedVal').innerText = val;
            channel.publish('change', { type: 'speed', val: val + 's' });
        }
        function sendMarquee(show) {
            const text = document.getElementById('marqueeInput').value || "恭喜大獎！";
            channel.publish('change', { type: 'marquee', val: { show: show, text: text } });
        }

        // 接收端
        channel.subscribe('change', function(message) {
            const data = message.data;
            const marqueeContainer = document.getElementById('marquee-container');
            const marqueeText = document.getElementById('marquee-text');

            if (data.type === 'color') {
                document.body.style.backgroundColor = data.val;
                document.getElementById('status').style.color = (data.val === '#FFFFFF' || data.val === '#FFD700') ? 'black' : 'white';
                marqueeText.style.color = (data.val === '#FFFFFF' || data.val === '#FFD700') ? 'black' : 'white';
            } else if (data.type === 'blink') {
                if (data.val) document.body.classList.add('blinking');
                else document.body.classList.remove('blinking');
            } else if (data.type === 'speed') {
                document.body.style.setProperty('--speed', data.val);
            } else if (data.type === 'marquee') {
                if (data.val.show) {
                    marqueeText.innerText = data.val.text;
                    marqueeContainer.style.display = 'block';
                } else {
                    marqueeContainer.style.display = 'none';
                }
            }
        });

        document.body.style.setProperty('--speed', '1s');
    </script>
</body>
</html>
