<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>尾牙控場 Ultimate</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
            transition: background-color 0.3s ease; 
            display: flex; justify-content: center; align-items: center; 
            font-family: "Microsoft JhengHei", sans-serif; touch-action: manipulation;
        }

        /* 閃爍動畫 */
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        .blinking { animation: blink var(--blink-speed) infinite; }

        /* 跑馬燈容器 - 修正 Android 顯示問題 */
        #marquee-container {
            position: absolute;
            width: 100vw;
            white-space: nowrap;
            overflow: visible;
            visibility: hidden; /* 使用 visibility 替代 display 以確保動畫預載 */
            z-index: 5;
        }
        .show-marquee { visibility: visible !important; }

        /* 跑馬燈動畫 */
        #marquee-text {
            display: inline-block;
            font-size: 18vh;
            font-weight: bold;
            color: white;
            padding-left: 100%; /* 確保從右側外開始 */
            animation: marquee var(--marquee-speed) linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200%); } /* 增加位移確保完全穿過畫面 */
        }

        /* 主控面板 */
        #admin-panel { 
            position: fixed; top: 10px; background: rgba(255, 255, 255, 0.95); 
            padding: 15px; display: none; z-index: 100; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 85%; max-width: 350px; text-align: center;
        }
        .ctrl-row { margin: 8px 0; border-top: 1px solid #eee; padding-top: 8px; font-size: 12px; color: #333; }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 5px; }
        .color-btn { width: 100%; aspect-ratio: 1; border: 1px solid #ddd; border-radius: 5px; }
        input[type="range"] { width: 100%; }
    </style>
</head>
<body onclick="enableFullscreen()">

    <div id="marquee-container">
        <span id="marquee-text">尾牙大吉！</span>
    </div>

    <div id="admin-panel">
        <div style="font-weight: bold; margin-bottom: 5px;">燈光控制</div>
        <div class="btn-grid">
            <button class="color-btn" style="background: red;" onclick="sendColor('red')"></button>
            <button class="color-btn" style="background: gold;" onclick="sendColor('gold')"></button>
            <button class="color-btn" style="background: blue;" onclick="sendColor('blue')"></button>
            <button class="color-btn" style="background: black;" onclick="sendColor('black')"></button>
        </div>

        <div class="ctrl-row">
            閃爍速度：<span id="blinkVal">1.0</span>s
            <input type="range" min="0.1" max="2.0" step="0.1" value="1.0" oninput="updateBlink(this.value)">
            <button onclick="toggleBlink(true)">啟動</button> <button onclick="toggleBlink(false)">停止</button>
        </div>

        <div class="ctrl-row">
            文字內容：<input type="text" id="mInput" placeholder="輸入文字" style="width:70%">
            <br>文字速度：<span id="mSpeedVal">5</span>s (越小越快)
            <input type="range" min="1" max="15" step="1" value="5" oninput="updateMSpeed(this.value)">
            <button onclick="sendMarquee(true)" style="background:#2ecc71; color:white;">開啟文字</button>
            <button onclick="sendMarquee(false)">關閉</button>
        </div>
    </div>

    <div id="status">點擊畫面進入全螢幕...</div>

    <script>
        const ABLY_API_KEY = 'cZshyg.HmG5Qw:R51peiFlUSI93TYcNN2gM7BlsvgGGAVFVQoaK62naGo'; 
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.has('admin');
        const ably = new Ably.Realtime({ key: ABLY_API_KEY });
        const channel = ably.channels.get('tail-gate-party');

        function enableFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => {});
            }
        }

        ably.connection.on('connected', () => {
            document.getElementById('status').innerText = isAdmin ? "控制端就緒" : "等待連線...";
            if (isAdmin) document.getElementById('admin-panel').style.display = 'block';
        });

        // 發送端
        function sendColor(c) { channel.publish('ev', { t: 'c', v: c }); }
        function toggleBlink(s) { channel.publish('ev', { t: 'b', v: s }); }
        function updateBlink(v) { 
            document.getElementById('blinkVal').innerText = v;
            channel.publish('ev', { t: 'bs', v: v + 's' }); 
        }
        function updateMSpeed(v) {
            document.getElementById('mSpeedVal').innerText = v;
            channel.publish('ev', { t: 'ms', v: v + 's' });
        }
        function sendMarquee(s) {
            const txt = document.getElementById('mInput').value || "恭喜大獎！";
            channel.publish('ev', { t: 'm', v: { s: s, t: txt } });
        }

        // 接收端
        channel.subscribe('ev', function(m) {
            const d = m.data;
            const mc = document.getElementById('marquee-container');
            const mt = document.getElementById('marquee-text');

            if (d.t === 'c') {
                document.body.style.backgroundColor = d.v;
                mt.style.color = (d.v === 'gold' || d.v === 'white') ? 'black' : 'white';
            } else if (d.t === 'b') {
                d.v ? document.body.classList.add('blinking') : document.body.classList.remove('blinking');
            } else if (d.t === 'bs') {
                document.body.style.setProperty('--blink-speed', d.v);
            } else if (d.t === 'ms') {
                document.body.style.setProperty('--marquee-speed', d.v);
            } else if (d.t === 'm') {
                if (d.v.s) {
                    mt.innerText = d.v.t;
                    mc.classList.add('show-marquee');
                } else {
                    mc.classList.remove('show-marquee');
                }
            }
        });

        // 初始化變數
        document.body.style.setProperty('--blink-speed', '1s');
        document.body.style.setProperty('--marquee-speed', '5s');
    </script>
</body>
</html>
