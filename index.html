<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>尾牙控場 Pro 版</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; transition: background-color 0.4s ease; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        
        #admin-panel { 
            position: fixed; top: 20px; background: rgba(255, 255, 255, 0.95); 
            padding: 15px; display: none; z-index: 100; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 85%; max-width: 400px; text-align: center;
        }

        /* 顏色按鈕網格 */
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .color-btn { width: 100%; aspect-ratio: 1; border: 1px solid #ddd; cursor: pointer; border-radius: 8px; }

        /* 自由調色盤 */
        .picker-area { border-top: 1px solid #eee; pt: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        input[type="color"] { width: 50px; height: 50px; border: none; cursor: pointer; background: none; }

        #status { color: white; font-size: 14px; background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="admin-panel">
        <div style="margin-bottom: 10px; font-weight: bold; color: #333;">快速選色</div>
        <div class="btn-grid">
            <button class="color-btn" style="background: #FF0000;" onclick="sendColor('#FF0000')"></button>
            <button class="color-btn" style="background: #FFD700;" onclick="sendColor('#FFD700')"></button>
            <button class="color-btn" style="background: #FF00FF;" onclick="sendColor('#FF00FF')"></button>
            <button class="color-btn" style="background: #800080;" onclick="sendColor('#800080')"></button>
            <button class="color-btn" style="background: #0000FF;" onclick="sendColor('#0000FF')"></button>
            <button class="color-btn" style="background: #00FFFF;" onclick="sendColor('#00FFFF')"></button>
            <button class="color-btn" style="background: #00FF00;" onclick="sendColor('#00FF00')"></button>
            <button class="color-btn" style="background: #FFFFFF;" onclick="sendColor('#FFFFFF')"></button>
        </div>

        <div class="picker-area">
            <span style="font-size: 13px; color: #666;">自訂顏色：</span>
            <input type="color" id="colorPicker" onchange="sendColor(this.value)">
            <button onclick="sendColor('#000000')" style="padding: 5px 10px;">全黑(關燈)</button>
        </div>
    </div>

    <div id="status">正在連線...</div>

    <script>
        const ABLY_API_KEY = 'cZshyg.HmG5Qw:R51peiFlUSI93TYcNN2gM7BlsvgGGAVFVQoaK62naGo'; 
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.has('admin');

        const ably = new Ably.Realtime({ key: ABLY_API_KEY });
        const channel = ably.channels.get('tail-gate-party');

        ably.connection.on('connected', () => {
            document.getElementById('status').innerText = isAdmin ? "控制端就緒" : "已連線，等待控場...";
            if (isAdmin) document.getElementById('admin-panel').style.display = 'block';
        });

        function sendColor(color) {
            channel.publish('colorChange', color);
        }

        channel.subscribe('colorChange', function(message) {
            const color = message.data;
            document.body.style.backgroundColor = color;
            // 自動切換文字顏色，避免看不見
            document.getElementById('status').style.color = (color === '#FFFFFF' || color === '#FFD700') ? 'black' : 'white';
        });
    </script>
</body>
</html>
